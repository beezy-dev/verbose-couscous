<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beezy.dev // Design Review Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bar-bg: #0e1117;
      --border: #1e2330;
      --amber: #f59e0b;
      --amber-light: #fbbf24;
      --text: #f4f5f7;
      --text-muted: #8b949e;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Switcher Bar */
    .top-bar {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      color: var(--amber);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .brand-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    .brand-info strong {
      color: var(--text);
    }

    /* Option Selector Tabs */
    .tab-group {
      display: flex;
      background: #050608;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--amber);
      color: #07080a;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    .tab-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.2);
    }

    /* Actions */
    .actions-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .external-link-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .external-link-btn:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    /* Main Viewport Container */
    .viewport-container {
      flex-grow: 1;
      position: relative;
      background: #000000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Switcher Bar -->
  <header class="top-bar">
    <div class="brand-section">
      <div class="brand-logo">beezy.dev</div>
      <div class="brand-info">
        Design Review &bull; <strong>The Systems Kernel (Updated with AIMES)</strong>
      </div>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" onclick="loadPreview('option1-systems-kernel.html', this)">
        <span>1. The Systems Kernel (Selected)</span>
        <span class="tab-badge">v2.5 + AIMES</span>
      </button>
      <button class="tab-btn" onclick="loadPreview('option2-hive-sovereign.html', this)">
        <span>2. The Hive Sovereign</span>
        <span class="tab-badge">Obsidian</span>
      </button>
      <button class="tab-btn" onclick="loadPreview('option3-runtime-console.html', this)">
        <span>3. The Runtime Console</span>
        <span class="tab-badge">Telemetry</span>
      </button>
    </div>

    <div class="actions-group">
      <a id="open-fullscreen" href="option1-systems-kernel.html" target="_blank" class="external-link-btn">
        Open Fullscreen ↗
      </a>
    </div>
  </header>

  <!-- Interactive Live Preview Frame -->
  <main class="viewport-container">
    <iframe id="preview-frame" src="option1-systems-kernel.html" title="beezy.dev Design Option Preview"></iframe>
  </main>

  <script>
    function loadPreview(url, btn) {
      document.getElementById('preview-frame').src = url;
      document.getElementById('open-fullscreen').href = url;

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
